[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slide-converter"
version = "0.1.0"
description = "슬라이드 장표를 본사 템플릿 양식으로 변환"
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=1.0",
    "anthropic>=2.14",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
slide-converter = "slide_converter.cli:main"

[tool.setuptools]
packages = ["slide_converter"]
